<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Document approvals{% endblock %}</title>
<style>
  :root { --ink:#1d2433; --muted:#667085; --line:#e4e7ec; --bg:#f7f8fa; --accent:#1f5eff; --ok:#12805c; --bad:#c4320a; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:10px 20px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  header strong { margin-right:auto; }
  header a { color:var(--ink); text-decoration:none; }
  main { max-width:1080px; margin:24px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-bottom:18px; }
  h1 { font-size:22px; margin:0 0 14px; } h2 { font-size:17px; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; color:var(--muted); letter-spacing:.03em; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:#eef2ff; color:#3538cd; }
  .pill.approved { background:#e7f6ef; color:var(--ok); } .pill.rejected { background:#fdecea; color:var(--bad); }
  .pill.waiting { background:#fff4e5; color:#b54708; }
  .pill.cancelled { background:#f2f4f7; color:#475467; }
  h3 { font-size:15px; margin:18px 0 4px; }
  code { font-size:13px; background:#f2f4f7; padding:1px 5px; border-radius:4px; }
  button.small { padding:4px 10px; font-size:13px; }
  .login-wrap { max-width:560px; margin:30px auto; }
  table.demo tr[data-user] { cursor:pointer; } table.demo tr[data-user]:hover td { background:#f5f8ff; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 16px; color:var(--muted); text-decoration:none; min-width:110px; }
  .stat b { display:block; font-size:22px; color:var(--ink); } .stat.on { border-color:var(--accent); }
  .sigrow { display:flex; gap:8px; align-items:center; margin-bottom:4px; } .sigrow .sig { max-height:36px; max-width:110px; object-fit:contain; }
  form.inline { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:0; }
  form.inline select { width:auto; padding:4px; } form.inline input[type=file] { max-width:190px; font-size:12px; }
  .card { overflow-x:auto; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input[type=text], input[type=password], select, textarea { width:100%; padding:8px; border:1px solid #cfd4dc; border-radius:6px; font:inherit; }
  button, .btn { display:inline-block; padding:8px 16px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; cursor:pointer; text-decoration:none; }
  .btn.secondary, button.secondary { background:#fff; color:var(--accent); }
  button.danger { background:#fff; color:var(--bad); border-color:var(--bad); }
  button.link { background:none; border:none; color:var(--ink); padding:0; }
  .flash { padding:10px 14px; border-radius:6px; margin-bottom:14px; }
  .flash.ok { background:#e7f6ef; } .flash.error { background:#fdecea; }
  .grid { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:18px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  iframe { width:100%; height:78vh; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .sig { max-height:70px; max-width:100%; background:repeating-conic-gradient(#f1f1f1 0 25%, #fff 0 50%) 0 0/12px 12px; border:1px solid var(--line); }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <strong>Document approvals</strong>
  {% if me %}
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('new_request') }}">Submit document</a>
    <a href="{{ url_for('signature') }}">My signature</a>
    {% if me.admin %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
    <form method="post" action="{{ url_for('logout') }}" style="margin:0">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link" title="Log out">{{ me.name }} &middot; log out</button>
    </form>
  {% endif %}
</header>
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
