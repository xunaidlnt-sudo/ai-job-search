# Builds the Stratum 4D desktop installers on native runners.
#   Windows: NSIS .exe installer
#   macOS:   .dmg (Intel + Apple Silicon)
#   Linux:   .AppImage and .deb
# Push to the stratum-4d branch (or main) to get installers as workflow artifacts.
# Push a tag like v0.2.0 to also attach them to a GitHub Release.

name: Desktop installers

on:
  push:
    branches: [stratum-4d, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            name: Windows
          # Intel and Apple Silicon DMGs are built in separate jobs: building both in
          # one job mounts two images under the same volume name and hdiutil fails.
          - os: macos-latest
            target: --mac --x64
            name: macOS-x64
          - os: macos-latest
            target: --mac --arm64
            name: macOS-arm64
          - os: ubuntu-latest
            target: --linux
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No code-signing certificates yet: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: stratum-4d-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-installers/*
          draft: true
